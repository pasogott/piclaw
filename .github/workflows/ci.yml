name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/web/**'
      - 'runtime/src/**'
      - 'runtime/test/**'
      - 'runtime/extensions/**'
      - 'runtime/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'BUN_VERSION'
      - 'qualification/pi-durable-130/**'
      - 'runtime/durable-engine/**'
      - 'Makefile'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/integration-gate.yml'
      - '.github/actions/native-qualification-setup/**'
      - 'scripts/native-*.ts'
      - 'scripts/native-gate-contract.json'
      - 'scripts/integration-test-suite.ts'
      - 'scripts/check-actions-workflows.ts'
  pull_request:
    paths:
      - 'runtime/web/**'
      - 'runtime/src/**'
      - 'runtime/test/**'
      - 'runtime/extensions/**'
      - 'runtime/scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'BUN_VERSION'
      - 'qualification/pi-durable-130/**'
      - 'runtime/durable-engine/**'
      - 'Makefile'
      - 'tsconfig*.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/integration-gate.yml'
      - '.github/actions/native-qualification-setup/**'
      - 'scripts/native-*.ts'
      - 'scripts/native-gate-contract.json'
      - 'scripts/integration-test-suite.ts'
      - 'scripts/check-actions-workflows.ts'

permissions:
  contents: read

# A newer SHA for the same PR/ref supersedes its previous CI result. Tag and
# release workflows intentionally have no cancellation concurrency group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Host and native qualification + frontend regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Bun version
        id: bun-version
        run: |
          version="$(tr -d '[:space:]' < BUN_VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install host tool executables
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          command -v fdfind
          command -v rg
          fdfind --version
          rg --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare pinned native qualification
        uses: ./.github/actions/native-qualification-setup

      - name: Run host and native CI contract
        run: make ci-full

      - name: Install SVG acceptance browsers
        uses: ./.github/actions/playwright-cache
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}
          browsers: --with-deps chromium webkit
          variant: chromium-webkit

      - name: Verify shared SVG images and Pele in Chromium and WebKit
        env:
          PICLAW_RUN_OPTIONAL_BROWSER_TESTS: '1'
          PICLAW_E2E_DISPOSABLE: '1'
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          bun run test:local --cwd runtime -- bun test --timeout=30000 test/web/svg-images.optional.test.ts
          PICLAW_OPTIONAL_BROWSER=webkit bun run test:local --cwd runtime -- bun test --timeout=30000 test/web/svg-images.optional.test.ts
          bun run test:local --cwd runtime -- bun test --timeout=30000 test/web/pele-renderer.playwright.optional.test.ts
          PICLAW_OPTIONAL_BROWSER=webkit bun run test:local --cwd runtime -- bun test --timeout=30000 test/web/pele-renderer.playwright.optional.test.ts

      - name: Verify CDP pane Chromium and Safari-engine clients
        env:
          PICLAW_TEST_CDP_CLIENTS: '1'
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: bun run test:local --cwd runtime -- bun test --timeout=60000 test/web/cdp-pane-browser.test.ts

      - name: Smoke-test isolated Git global install
        run: bun run smoke:repo-install
